name: container-contracts
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
jobs:
  mosquitto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Start Mosquitto
        run: |
          for attempt in $(seq 1 5); do
            docker pull eclipse-mosquitto:2.0.22 && break
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 10))
          done
          docker run -d --name ohe-mosquitto \
            -p 1883:1883 \
            -v "$PWD/spec/v1.0.0/fixtures/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            eclipse-mosquitto:2.0.22
          for i in $(seq 1 30); do
            python3 -c 'import socket;s=socket.create_connection(("127.0.0.1",1883),2);s.close()' && exit 0
            sleep 1
          done
          exit 1
      - name: MQTT broker contract
        env:
          OHE_MQTT_BROKER: mqtt://127.0.0.1:1883
        run: swift test --filter MosquittoExternalBrokerTests
  home-assistant-current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Start Home Assistant 2026.8.3
        run: |
          for attempt in $(seq 1 5); do
            docker pull ghcr.io/home-assistant/home-assistant:2026.8.3 && break
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 10))
          done
          docker run -d --name ohe-ha \
            -p 8123:8123 \
            -v "$PWD/spec/v1.0.0/fixtures/ha-ci:/config" \
            ghcr.io/home-assistant/home-assistant:2026.8.3
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8123/api/onboarding >/dev/null && exit 0
            sleep 2
          done
          docker logs ohe-ha
          exit 1
      - name: Catalogue statistics contract
        env:
          OHE_HA_URL: http://127.0.0.1:8123
          OHE_HA_WAIT_SECONDS: "480"
        run: swift run hacontract
  home-assistant-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Start Home Assistant 2025.9.4
        run: |
          for attempt in $(seq 1 5); do
            docker pull ghcr.io/home-assistant/home-assistant:2025.9.4 && break
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 10))
          done
          docker run -d --name ohe-ha \
            -p 8123:8123 \
            -v "$PWD/spec/v1.0.0/fixtures/ha-ci:/config" \
            ghcr.io/home-assistant/home-assistant:2025.9.4
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8123/api/onboarding >/dev/null && exit 0
            sleep 2
          done
          docker logs ohe-ha
          exit 1
      - name: Catalogue statistics contract
        env:
          OHE_HA_URL: http://127.0.0.1:8123
          OHE_HA_WAIT_SECONDS: "480"
        run: swift run hacontract
  otlp-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Start OpenTelemetry Collector 0.160.0
        run: |
          docker run -d --name ohe-otel \
            -p 4318:4318 \
            -v "$PWD/spec/v1.0.0/fixtures/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.160.0
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 4318 && exit 0
            sleep 1
          done
          docker logs ohe-otel
          exit 1
      - name: OTLP HTTP protobuf contract
        env:
          OHE_OTLP_ENDPOINT: http://127.0.0.1:4318/v1/traces
        run: |
          swift run otlpcontract
          for i in $(seq 1 30); do
            if docker logs ohe-otel 2>&1 | grep -q 'Name[[:space:]]*: export.run'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ohe-otel
          exit 1
