name: macos-build
on:
  push:
  pull_request:
concurrency:
  # Each commit on main gets its own concurrency group, so runs never contend and
  # none is left marked cancelled. Grouping by ref is not enough: with
  # cancel-in-progress false GitHub still cancels the *pending* run when a newer
  # one queues, so a run could only ever be superseded rather than completed.
  # Off main, superseding is exactly what we want.
  group: macos-build-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  darwin-package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install broker tools
        run: brew install mosquitto
      - name: Test Darwin package targets
        run: swift test
      - name: Test MQTT against Mosquitto on Darwin
        env:
          OHE_MQTT_BROKER: mqtt://127.0.0.1:1883
        run: |
          mosquitto \
            -c spec/v1.0.0/fixtures/mosquitto/mosquitto.conf \
            -d
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 1883 && break
            test "$i" -lt 30 || exit 1
            sleep 1
          done
          swift test --filter MosquittoExternalBrokerTests

  ios-app:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS exporter and widget
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target ExporteriOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test critical iOS UI paths
        run: |
          DESTINATION_ID="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"]))'
          )"
          # Each UI case drives its own simulator clone, so the suite scales with
          # the runner instead of serialising fourteen app launches.
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -scheme ExporteriOS \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            -configuration Debug \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 3 \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/ohe-ui.xcresult" \
            test
      # xcodebuild's summary names the failing case but not the assertion, which
      # leaves a red UI run with nothing to diagnose it from.
      - name: Keep the UI result bundle when a case fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-xcresult
          path: ${{ runner.temp }}/ohe-ui.xcresult
          retention-days: 7

  mac-companion:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS companion
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target CompanionMac \
            -sdk macosx \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  release-artifact-scan:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Release configuration cannot enable DEBUG
        run: |
          for target in ExporteriOS StatusWidget CompanionMac; do
            conditions="$(
              xcodebuild \
                -project OpenHealthExporter.xcodeproj \
                -target "$target" \
                -configuration Release \
                -showBuildSettings |
                sed -n 's/^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = //p'
            )"
            if [[ " $conditions " == *" DEBUG "* ]]; then
              echo "DEBUG is enabled for the Release configuration of $target: $conditions"
              exit 1
            fi
            echo "$target Release compilation conditions: ${conditions:-<none>}"
          done
      - name: Build shipped Apple binaries in Release
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target ExporteriOS \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ohe-release-ios" \
            OBJROOT="$RUNNER_TEMP/ohe-release-ios-obj" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target CompanionMac \
            -sdk macosx \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ohe-release-mac" \
            OBJROOT="$RUNNER_TEMP/ohe-release-mac-obj" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Release apps omit fault seams and health-data canaries
        run: |
          scripts/scan-release-artifacts.sh \
            "$RUNNER_TEMP/ohe-release-ios/Release-iphoneos" \
            "$RUNNER_TEMP/ohe-release-mac/Release"
