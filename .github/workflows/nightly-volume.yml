name: nightly-volume
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
jobs:
  tier-one-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Build release corpus generator
        run: swift build -c release --product corpusgen --product pipelinecheck
      - name: Generate ten million records reproducibly
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          first="$(
            .build/release/corpusgen --tier T1 --seed 1 |
              sha256sum |
              cut -d' ' -f1
          )"
          first_seconds=$((SECONDS - started))
          test "$first_seconds" -le 600

          started=$SECONDS
          second="$(
            .build/release/corpusgen --tier T1 --seed 1 |
              sha256sum |
              cut -d' ' -f1
          )"
          second_seconds=$((SECONDS - started))
          test "$second_seconds" -le 600
          test "$first" = "$second"
          printf 'tier=T1 records=10000000 sha256=%s first_s=%s second_s=%s\n' \
            "$first" "$first_seconds" "$second_seconds"
      - name: Validate a T1 prefix through the schema pipeline
        run: |
          .build/release/corpusgen --tier T1 --seed 1 --count 5000 |
            .build/release/pipelinecheck
  tier-two-pathologies:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Build release corpus generator
        run: swift build -c release --product corpusgen
      - name: Exercise fifty-million-record pathological tier
        shell: bash
        run: |
          set -euo pipefail
          digest="$(
            .build/release/corpusgen --tier T2 --seed 1 |
              sha256sum |
              cut -d' ' -f1
          )"
          test "${#digest}" -eq 64
          printf 'tier=T2 records=50000000 sha256=%s\n' "$digest"
