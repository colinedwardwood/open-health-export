name: Release gate
description: Evidence checklist required before publishing a release
title: "Release: "
labels:
  - release
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: v1.2.3
    validations:
      required: true
  - type: input
    id: wire-version
    attributes:
      label: Wire specification version
      placeholder: spec/v1.0.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant integration version
      placeholder: ha/v0.3.0 or unchanged
    validations:
      required: true
  - type: textarea
    id: qa-evidence
    attributes:
      label: QA evidence
      description: Put device pass, soak, canary, energy, accessibility, performance, migration, P0/P1, and flake evidence on separate linked lines.
    validations:
      required: true
  - type: textarea
    id: compliance-evidence
    attributes:
      label: Compliance evidence
      description: Put the named reviewers and linked R-109 and R-111 sign-offs on separate lines.
    validations:
      required: true
  - type: textarea
    id: provenance-evidence
    attributes:
      label: Provenance and stranger-test evidence
      description: Put BUILDINFO, SBOM, attestations, clean build-from-source result, and last-good tag on separate linked lines.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Required gates
      options:
        - label: All three version streams and compatibility metadata are correct.
          required: true
        - label: README maintenance status and supported-OS matrix are current.
          required: true
        - label: T0–T3 CI is green (linux-core, macos-build including from-source, container-contracts, secrets, spec-freeze, DCO).
          required: true
        - label: No QA-22 upstream canary has been red for more than 24 hours without an accepted tracking issue.
          required: true
        - label: Device, soak, accessibility, localisation, performance, energy, migration, and flake evidence is attached.
          required: true
        - label: The published last-20-nightly flake-rate proxy is at or below 1%.
          required: true
        - label: Critical modules meet 90% line coverage, changed executable lines meet 80%, and the anchor/checkpoint transition assertion reports 100%.
          required: true
        - label: Upgrade-from-previous-release was exercised against a migrated store, or this is the first release.
          required: true
        - label: There are no open P0 or P1 defects accepted into this release.
          required: true
        - label: Privacy manifests, licences, store copy, disclaimers, SBOM, and attestations were reviewed.
          required: true
        - label: Both named compliance reviewers approved the release.
          required: true
        - label: No feature, update, artifact, or beta seat is sponsor-gated; any TestFlight public link was checked manually.
          required: true
        - label: A person unaffiliated with implementation completed the clean build-from-source stranger test without repository, Apple, or signing access.
          required: true
        - label: Roll-forward instructions and the last-good tag are recorded.
          required: true
