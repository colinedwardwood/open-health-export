name: spec freeze
on:
  pull_request:
    paths:
      - spec/v1.0.0/**
  push:
    paths:
      - spec/v1.0.0/**
concurrency:
  group: spec-freeze-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3.3"
      - name: Schema, receiver, and freeze policy
        run: swift run policycheck
