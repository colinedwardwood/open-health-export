name: nightly-volume
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
    - cron: "17 4 * * 0"

concurrency:
  # T2 is a six-hour job. A manual dispatch landing on top of the nightly run
  # otherwise generated fifty million records twice at once. Queue instead of
  # cancelling: the run already underway is the one closest to producing evidence.
  group: nightly-volume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tier-one-corpus:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Build release corpus generator
        run: |
          swift build -c release --product corpusgen
          swift build -c release --product pipelinecheck
          swift build -c release --product exportruncheck
      - name: Generate ten million records within the budget
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          first="$(
            .build/release/corpusgen --tier T1 --seed 1 |
              sha256sum |
              cut -d' ' -f1
          )"
          first_seconds=$((SECONDS - started))
          test "$first_seconds" -le 600
          printf '%s\n' "$first" > /tmp/t1-first.sha256
          printf 'tier=T1 records=10000000 sha256=%s generation_s=%s\n' \
            "$first" "$first_seconds"
      - name: Reproduce and validate all ten million records
        shell: bash
        run: |
          set -euo pipefail
          # The second deterministic generation does double duty: a named pipe hashes
          # the exact stream while pipelinecheck validates every record. This closes
          # QA-04 without paying for a third ten-million-record generation.
          mkfifo /tmp/t1-hash-stream
          sha256sum < /tmp/t1-hash-stream | cut -d' ' -f1 > /tmp/t1-second.sha256 &
          hash_pid=$!
          .build/release/corpusgen --tier T1 --seed 1 |
            tee /tmp/t1-hash-stream |
            .build/release/pipelinecheck |
            tee /tmp/t1-pipeline.out
          wait "$hash_pid"
          test "$(cat /tmp/t1-second.sha256)" = "$(cat /tmp/t1-first.sha256)"
          grep -Fx 'pipelinecheck lines=10000001' /tmp/t1-pipeline.out
      - name: Exercise ExportRun within its memory ceiling
        shell: bash
        run: |
          set -euo pipefail
          .build/release/corpusgen --tier T1 --seed 1 |
            .build/release/exportruncheck --page-size 10000 2>&1 |
            tee /tmp/t1-exportrun.out
          grep -F 'exportruncheck outcome=success' /tmp/t1-exportrun.out
          grep -F 'declared_records=10000000' /tmp/t1-exportrun.out
          grep -F 'limit_mib=100' /tmp/t1-exportrun.out
          grep -F 'formats=native-ndjson,native-json,native-json-pretty,csv,hae' /tmp/t1-exportrun.out
  # One GitHub-hosted job is 360 minutes. Piping 50 million records through
  # pipelinecheck and ExportRun together hit that wall with no success line.
  # Each consumer now gets its own generation and its own budget.
  tier-two-pathologies:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Build release corpus generator
        run: |
          swift build -c release --product corpusgen
          swift build -c release --product pipelinecheck
      - name: Validate all fifty million records
        shell: bash
        run: |
          set -euo pipefail
          mkfifo /tmp/t2-hash-stream
          sha256sum < /tmp/t2-hash-stream |
            cut -d' ' -f1 > /tmp/t2.sha256 &
          hash_pid=$!
          .build/release/corpusgen --tier T2 --seed 1 |
            tee /tmp/t2-hash-stream |
            .build/release/pipelinecheck |
            tee /tmp/t2-pipeline.out
          wait "$hash_pid"
          digest="$(cat /tmp/t2.sha256)"
          test "${#digest}" -eq 64
          grep -Fx 'pipelinecheck lines=50000001' /tmp/t2-pipeline.out
          grep -Fx \
            'pipelinecheck concentrated_heart_prefix=20000000 year_range=2010-2024 distinct_years=15' \
            /tmp/t2-pipeline.out
          printf 'tier=T2 records=50000000 sha256=%s\n' "$digest"
  tier-two-exportrun:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        with:
          swift-version: "6.3.3"
      - name: Build release corpus generator
        run: |
          swift build -c release --product corpusgen
          swift build -c release --product exportruncheck
      - name: Exercise ExportRun within its memory ceiling
        shell: bash
        run: |
          set -euo pipefail
          .build/release/corpusgen --tier T2 --seed 1 |
            .build/release/exportruncheck --page-size 10000 2>&1 |
            tee /tmp/t2-exportrun.out
          grep -F 'exportruncheck outcome=success' /tmp/t2-exportrun.out
          grep -F 'declared_records=50000000' /tmp/t2-exportrun.out
          grep -F 'limit_mib=100' /tmp/t2-exportrun.out
          grep -F 'formats=native-ndjson,native-json,native-json-pretty,csv,hae' /tmp/t2-exportrun.out
