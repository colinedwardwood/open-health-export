name: spec freeze
on:
  pull_request:
    paths:
      - spec/v1.0.0/**
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen tree is additive only
        run: |
          echo "spec freeze gate stub — v1.0.0 is not yet FROZEN"
