name: linux-core
on:
  push:
  pull_request:
concurrency:
  # Each commit on main gets its own concurrency group, so runs never contend and
  # none is left marked cancelled. Grouping by ref is not enough: with
  # cancel-in-progress false GitHub still cancels the *pending* run when a newer
  # one queues, so a run could only ever be superseded rather than completed.
  # Off main, superseding is exactly what we want.
  group: linux-core-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # OSS-15. Kept separate from export-core so a licence-header slip reports as a
  # licence failure rather than hiding inside a 90-minute test job.
  licence-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned: an unpinned linter turns someone else's release into our red build.
      # charset-normalizer replaces libmagic, which reuse otherwise needs from apt.
      - name: Install REUSE
        run: pipx install 'reuse[charset-normalizer]==6.2.0'
      - name: Lint licence and copyright headers
        run: reuse lint

  export-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.3.3"
      - name: Install zlib headers and Mosquitto
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev mosquitto
      - name: Build Linux core
        run: swift build --target CoreDomain && swift build --target CorrectnessEngine
      - name: Test
        timeout-minutes: 30
        run: swift test
      - name: Stream T0 through the schema pipeline
        run: swift run pipelinecheck < spec/v1.0.0/fixtures/tier0.ndjson
      - name: Import policy
        run: swift run policycheck
      - name: Release objects omit R-83 fault seams
        run: |
          swift build -c release --target CorrectnessEngine
          find .build -path '*release*CorrectnessEngine.build*' -name '*.o' -print0 \
            | xargs -0 strings > /tmp/correctness-release.symbols
          while read -r symbol; do
            if grep -F "$symbol" /tmp/correctness-release.symbols; then
              echo "R-83 test-only symbol leaked into release objects: $symbol"
              exit 1
            fi
          done <<'EOF'
          ExportFaultLocation
          ExportFaultInjector
          NoExportFaults
          afterRead
          afterTransform
          afterEnqueueBeforeDestinationWrite
          afterDestinationWriteBeforeAck
          afterAckBeforeRelease
          duringAnchorPersist
          OHE_PROCESS_EXIT_SEAM
          EOF
      - name: Reproduce committed tier-zero corpus
        run: |
          swift run corpusgen --seed 1 --count 200 > /tmp/tier0.ndjson
          cmp spec/v1.0.0/fixtures/tier0.ndjson /tmp/tier0.ndjson
          echo "2ebb58f7a3232661d95249b180be794030946277384057d74e9e555252caf4d3  /tmp/tier0.ndjson" | sha256sum --check -
      - name: Fuzz the wire decoders
        run: |
          swift run wirefuzz --iterations 200000
          swift run wirefuzz --seed 0x1 --iterations 200000
          swift run wirefuzz --seed $(date +%s) --iterations 200000
      - name: Reference receiver HTTP surface
        run: |
          swift run receiver serve --port 18080 --seed spec/v1.0.0/fixtures/receiver-sequence.ndjson &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          curl -fsS http://127.0.0.1:18080/metrics | grep 'ohe_receiver_live_quantity_last{metric_id="heart_rate"} 72'
          printf '%s\n' '{"kind":"sample.quantity","metricId":"step_count","uuid":"cccccccc-cccc-4ccc-8ccc-cccccccccccc","value":3}' \
            | curl -fsS -X POST --data-binary @- http://127.0.0.1:18080/ingest
          curl -fsS http://127.0.0.1:18080/metrics | grep 'metric_id="step_count"'
