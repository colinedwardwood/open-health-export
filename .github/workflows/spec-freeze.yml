name: spec freeze
on:
  pull_request:
    paths:
      - spec/v1.0.0/**
  push:
    paths:
      - spec/v1.0.0/**
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.3.3"
      - name: Schema, receiver, and freeze policy
        run: swift run policycheck
