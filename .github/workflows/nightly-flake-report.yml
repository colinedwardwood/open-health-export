name: nightly-flake-report
on:
  workflow_run:
    workflows: [nightly-volume]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compute the last 20 nightly conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/nightly-flake-rate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --markdown nightly-flake-rate.md \
            --json-output nightly-flake-rate.json
          cat nightly-flake-rate.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish release-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-flake-rate
          path: |
            nightly-flake-rate.md
            nightly-flake-rate.json
          retention-days: 90
