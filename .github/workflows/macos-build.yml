name: macos-build
on:
  push:
  pull_request:
concurrency:
  # CI establishes the state of the current ref, not every intermediate push.
  # Keeping a per-SHA group on main accumulated an unbounded queue: every commit
  # retained five build jobs followed by six 90-minute UI jobs. Obsolete runs
  # then held all hosted macOS capacity while the commit we cared about waited.
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  darwin-package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install broker tools
        run: brew install mosquitto
      - name: Test Darwin package targets
        run: swift test
      - name: Test MQTT against Mosquitto on Darwin
        env:
          OHE_MQTT_BROKER: mqtt://127.0.0.1:1883
        run: |
          mosquitto \
            -c spec/v1.0.0/fixtures/mosquitto/mosquitto.conf \
            -d
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 1883 && break
            test "$i" -lt 30 || exit 1
            sleep 1
          done
          swift test --filter MosquittoExternalBrokerTests

  ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build the app and its UI tests once
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -scheme ExporteriOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ohe-dd" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Publish the built products for the test shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ohe-dd/Build/Products
          retention-days: 1

  ios-ui:
    needs: ios-build
    runs-on: macos-26
    # The suite ran to the wall on one runner. Shards cover both required device
    # families, and reuse the products built once above.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Collect the built products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/products
      - name: Test critical iOS UI paths on ${{ matrix.family }} (shard ${{ matrix.shard }} of 3)
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          DESTINATION_ID="$(bash scripts/ui-test-simulator.sh "$DEVICE_FAMILY")"
          # One simulator per runner. Three clones on a runner this size timed out
          # launching the app, which reads as a test failure and is not one. The
          # parallelism lives in the shards now, where it costs no simulator memory.
          #
          # A single retry covers the launch timeouts that remain: they come from the
          # simulator, not the app, and a case that genuinely fails still fails twice.
          # The result bundle keeps the first attempt either way.
          # shellcheck disable=SC2046
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP"/products/*.xctestrun \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            -resultBundlePath "$RUNNER_TEMP/ohe-ui.xcresult" \
            $(bash scripts/ui-test-shard.sh ${{ matrix.shard }} 3)
      # xcodebuild's summary names the failing case but not the assertion, which
      # leaves a red UI run with nothing to diagnose it from.
      - name: Keep the UI result bundle when a case fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-${{ matrix.family }}-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/ohe-ui.xcresult
          retention-days: 7

  from-source:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the tools the README names
        run: brew install xcodegen
      - name: Build from source the way the README says
        run: ./scripts/build-from-source.sh

  mac-companion:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS companion
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target CompanionMac \
            -sdk macosx \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  release-artifact-scan:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Release configuration cannot enable DEBUG
        run: |
          for target in ExporteriOS StatusWidget CompanionMac; do
            conditions="$(
              xcodebuild \
                -project OpenHealthExporter.xcodeproj \
                -target "$target" \
                -configuration Release \
                -showBuildSettings |
                sed -n 's/^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = //p'
            )"
            if [[ " $conditions " == *" DEBUG "* ]]; then
              echo "DEBUG is enabled for the Release configuration of $target: $conditions"
              exit 1
            fi
            echo "$target Release compilation conditions: ${conditions:-<none>}"
          done
      - name: Build shipped Apple binaries in Release
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target ExporteriOS \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ohe-release-ios" \
            OBJROOT="$RUNNER_TEMP/ohe-release-ios-obj" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target CompanionMac \
            -sdk macosx \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ohe-release-mac" \
            OBJROOT="$RUNNER_TEMP/ohe-release-mac-obj" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Release apps omit fault seams and health-data canaries
        run: |
          scripts/scan-release-artifacts.sh \
            "$RUNNER_TEMP/ohe-release-ios/Release-iphoneos" \
            "$RUNNER_TEMP/ohe-release-mac/Release"
      - name: Telemetry stays within its uncompressed app-size budget
        run: scripts/check-obs25-telemetry-size.sh
