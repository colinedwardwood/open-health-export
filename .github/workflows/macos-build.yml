name: macos-build
on:
  push:
  pull_request:
concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  darwin:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and broker tools
        run: brew install xcodegen mosquitto
      - name: Test Darwin package targets
        run: swift test
      - name: Test MQTT against Mosquitto on Darwin
        env:
          OHE_MQTT_BROKER: mqtt://127.0.0.1:1883
        run: |
          mosquitto \
            -c spec/v1.0.0/fixtures/mosquitto/mosquitto.conf \
            -d
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 1883 && break
            test "$i" -lt 30 || exit 1
            sleep 1
          done
          swift test --filter mosquittoQoS
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS exporter and widget
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target ExporteriOS \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test critical iOS UI paths
        run: |
          DESTINATION_ID="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"]))'
          )"
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -scheme ExporteriOS \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build macOS companion
        run: |
          xcodebuild \
            -project OpenHealthExporter.xcodeproj \
            -target CompanionMac \
            -sdk macosx \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
