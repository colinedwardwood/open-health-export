name: mutation
on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * 0"
permissions:
  contents: read
jobs:
  kill-committed-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.3.3"
      - name: Install zlib headers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Each committed mutant must fail its named test
        run: python3 scripts/mutation-check.py
