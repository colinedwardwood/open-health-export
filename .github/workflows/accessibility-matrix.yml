name: accessibility-matrix
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"

concurrency:
  # A newer full matrix supersedes one that has not acquired macOS runners yet.
  # Scheduled/manual overlap must not reserve two more long-lived runner slots.
  group: accessibility-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-state-matrix:
    name: full-state-matrix (${{ matrix.family }}, ${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: ./scripts/generate-project.sh
      - name: Run every UI state and accessibility audit on ${{ matrix.family }} (shard ${{ matrix.shard }} of 6)
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          destination="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json, os, sys
          family = os.environ["DEVICE_FAMILY"]
          devices = json.load(sys.stdin)["devices"]
          print(next(
              item["udid"]
              for runtime in devices.values()
              for item in runtime
              if family in item["name"]
          ))
          '
          )"
          # shellcheck disable=SC2046
          xcodebuild test \
            -project OpenHealthExporter.xcodeproj \
            -scheme ExporteriOS \
            -destination "platform=iOS Simulator,id=$destination" \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            -resultBundlePath "$RUNNER_TEMP/accessibility-${DEVICE_FAMILY}-${{ matrix.shard }}.xcresult" \
            $(bash scripts/ui-test-shard.sh ${{ matrix.shard }} 6)
      - name: Keep accessibility result bundle on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-${{ matrix.family }}-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/accessibility-${{ matrix.family }}-${{ matrix.shard }}.xcresult
          retention-days: 7
