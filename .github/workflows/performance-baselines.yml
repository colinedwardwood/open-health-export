name: performance-baselines
on:
  workflow_dispatch:

concurrency:
  group: performance-baselines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.3.3"
      - name: Build and verify the regression comparator
        run: |
          swift build -c release --product m0harness
          "$(swift build -c release --show-bin-path)/m0harness" verify

  pre-release-performance:
    runs-on: [self-hosted, macOS, performance]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare permitted-launch proxy with committed baseline
        env:
          OHE_PERFORMANCE_ITERATIONS: "100"
        run: |
          scripts/check-performance-baseline.sh \
            qa/baselines/m0-host-permitted-launch.json \
            "$RUNNER_TEMP/candidate.json" \
            "$RUNNER_TEMP/comparison.json"
      - name: Retain machine-readable timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0-host-permitted-launch
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/comparison.json
          retention-days: 30
