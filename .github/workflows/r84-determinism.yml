name: r84-determinism
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # The gate needs one complete result for the current ref. Preserving every
  # intermediate main SHA queued an obsolete macos-26 leg for every push and
  # competed with the primary Apple build for scarce hosted runners.
  group: r84-determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  utc-fixed-offset:
    # Hosted runners that GitHub currently provides for this gate. Linux x86_64,
    # Linux arm64, and macOS arm64. Darwin x86_64 is omitted because GitHub no
    # longer hosts Intel macOS images.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup_swift: true
          - os: ubuntu-24.04-arm
            setup_swift: true
          - os: macos-26
            setup_swift: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-swift
        if: matrix.setup_swift
        with:
          swift-version: "6.3.3"
      - name: Install Linux headers the package graph may probe
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libsqlite3-dev \
            || { sleep 20; sudo apt-get update; sudo apt-get install -y zlib1g-dev libsqlite3-dev; }
      - name: Record hosted architecture honestly
        run: |
          printf 'runner=%s os=%s arch=%s\n' \
            '${{ matrix.os }}' "$(uname -s)" "$(uname -m)"
      - name: R-84/QA-07 100-run UTC/fixed-offset digest gate
        env:
          OHE_DETERMINISM_RUNS: "100"
          OHE_DETERMINISM_TZ: Etc/GMT+5
          OHE_DETERMINISM_LC_ALL: C
        run: bash scripts/check-r84-determinism.sh
