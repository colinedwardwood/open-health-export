name: linux-core
on:
  push:
  pull_request:
jobs:
  export-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc # v3
        with:
          swift-version: "6.3.3"
      - name: Install zlib headers and Mosquitto
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev mosquitto
      - name: Build Linux core
        run: swift build --target CoreDomain && swift build --target CorrectnessEngine
      - name: Test
        run: swift test
      - name: Stream T0 through the schema pipeline
        run: swift run pipelinecheck < spec/v1.0.0/fixtures/tier0.ndjson
      - name: Import policy
        run: swift run policycheck
      - name: Release objects omit R-83 fault seams
        run: |
          swift build -c release --target CorrectnessEngine
          find .build -path '*release*CorrectnessEngine.build*' -name '*.o' -print0 \
            | xargs -0 strings > /tmp/correctness-release.symbols
          while read -r symbol; do
            if grep -F "$symbol" /tmp/correctness-release.symbols; then
              echo "R-83 test-only symbol leaked into release objects: $symbol"
              exit 1
            fi
          done <<'EOF'
          ExportFaultLocation
          ExportFaultInjector
          NoExportFaults
          afterRead
          afterTransform
          afterEnqueueBeforeDestinationWrite
          afterDestinationWriteBeforeAck
          afterAckBeforeRelease
          duringAnchorPersist
          OHE_PROCESS_EXIT_SEAM
          EOF
      - name: Reproduce committed tier-zero corpus
        run: |
          swift run corpusgen --seed 1 --count 200 > /tmp/tier0.ndjson
          cmp spec/v1.0.0/fixtures/tier0.ndjson /tmp/tier0.ndjson
          echo "8313b7a761132295c38557f2e2c56cd2aedc8ecb93b0633d73802977d6751f9c  /tmp/tier0.ndjson" | sha256sum --check -
      - name: Fuzz the wire decoders
        run: |
          swift run wirefuzz --iterations 200000
          swift run wirefuzz --seed 0x1 --iterations 200000
          swift run wirefuzz --seed $(date +%s) --iterations 200000
