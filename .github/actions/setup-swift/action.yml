# Installs the pinned Swift toolchain on Linux runners from swift.org, verified by a
# SHA-256 recorded here. This replaces swift-actions/setup-swift, which began
# bootstrapping through Swiftly and failing its GPG check ("No public key") on
# hosted runners in September 2026. The digests were taken from tarballs whose
# swift.org release signatures verified against https://www.swift.org/keys/all-keys.asc.
name: Set up pinned Swift (Linux)
description: Download, verify, and put the pinned Swift toolchain first on PATH.
inputs:
  swift-version:
    description: Toolchain version. Only versions with a digest below are accepted.
    required: false
    default: "6.3.3"
runs:
  using: composite
  steps:
    - name: Install Swift ${{ inputs.swift-version }}
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "setup-swift: Linux only; runner is $RUNNER_OS" >&2
          exit 1
        fi
        case "$SWIFT_VERSION/$RUNNER_ARCH_NAME" in
          6.3.3/X64)
            platform=ubuntu2404
            file=swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
            digest=da8272a5fddccd65b1529ed0e52e04526e2eadd4237d58d6220efeb973c6cd19
            ;;
          6.3.3/ARM64)
            platform=ubuntu2404-aarch64
            file=swift-6.3.3-RELEASE-ubuntu24.04-aarch64.tar.gz
            digest=47126395429653fa768d370655876ec1b68f6a95c7884f5e4f179700141c9b7f
            ;;
          *)
            echo "setup-swift: no pinned digest for $SWIFT_VERSION on $RUNNER_ARCH_NAME" >&2
            exit 1
            ;;
        esac
        url="https://download.swift.org/swift-${SWIFT_VERSION}-release/${platform}/swift-${SWIFT_VERSION}-RELEASE/${file}"
        dest="$RUNNER_TEMP/swift-${SWIFT_VERSION}"
        mkdir -p "$dest"
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          --output "$RUNNER_TEMP/$file" "$url"
        echo "${digest}  $RUNNER_TEMP/$file" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$file" -C "$dest" --strip-components=1
        rm -f "$RUNNER_TEMP/$file"
        echo "$dest/usr/bin" >> "$GITHUB_PATH"
        "$dest/usr/bin/swift" --version | tee /dev/stderr | grep -F "Swift version ${SWIFT_VERSION} " >/dev/null
